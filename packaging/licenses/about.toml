# cargo-about の設定。mise run licenses (tools/licenses の gnn-licenses) が、配布物の実行ファイルに組み込む
# Rust のクレートのライセンスの一覧 (crates/gnn-app/assets/licenses/THIRD_PARTY_LICENSES.md) を、
# ひな形 about.hbs から作る。補正 (clarify) で拾えないものの扱いは allowlist.toml。

# 使ってよいライセンス。ここにないライセンスのクレートが入ると、一覧を作れずに止まる (CI も止まる)。
# 足すときは、配布物で守る条件 (表示・ソースの入手先など) を確かめてから。
# 複数から選べるクレートは、先に書いたものを選ぶ。MIT を最優先にし (ほとんどのクレートが選べ、著作権表示が
# そのまま載る)、ほかは条件の軽い順に並べる。Apache-2.0 (NOTICE の扱いが要る) と MPL-2.0 (ソースの入手先を
# 知らせる) は後ろに置く。特定のクレートにだけ許すものは、そのクレートの accepted に書く。
accepted = [
    "MIT",
    "0BSD",
    "CC0-1.0",
    "BSL-1.0",
    "ISC",
    "Zlib",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "Unicode-3.0",
    "Apache-2.0",
    "MPL-2.0",
]

# 配る実行ファイルのターゲット (Windows x64 と macOS Apple Silicon)。ほかの OS だけの依存は外す
targets = ["x86_64-pc-windows-msvc", "aarch64-apple-darwin"]
# ビルドのときだけ使う依存と、テストの依存は実行ファイルに入らない
ignore-build-dependencies = true
ignore-dev-dependencies = true
# 自分のクレート (publish = false) はアプリ本体 (LICENSE) なので外す。第三者のクレートが外れていないかは
# gnn-licenses が確かめる
private = { ignore = true }
# 本文はクレートの直下のファイルから探す。下の階層まで探すと、ライセンスの文を頭に書いたソースファイルが
# 丸ごと本文として入る。下の階層のライセンスのファイル (内包したコードのものなど) は、下の clarify で入れるか、
# 入れない理由を allowlist.toml に書く (gnn-licenses が確かめる)
max-depth = 1

# ---- clarify ----------------------------------------------------------------------------------
# パッケージの本文を cargo-about が拾えない、またはパッケージに本文がないクレートの、本文のファイルと
# SHA-256。files はパッケージの中、git は公開時のコミット (.cargo_vcs_info.json) のリポジトリの中のパス。
# start・end を書くと、その区間だけを本文にする。clarify の license はクレートの Cargo.toml の式の代わりに
# 使われる (gnn-licenses が、選んだライセンスが元の式を満たすかを確かめる)。
# クレートを上げてファイルが変わると、cargo-about が警告を出して gnn-licenses が止まる。新しいファイルを
# 確かめて SHA-256 を直す (cargo about clarify <パス> path <クレートのフォルダ> で計算できる)。

# AccessKit のパッケージには本文がない。リポジトリの LICENSE-MIT には著作権者がなく、AUTHORS に書いてある。
# 多くの部分は Chromium のコードに由来し、その BSD のライセンス (LICENSE.chromium) にも従う (README)
[accesskit.clarify]
license = "(MIT OR Apache-2.0) AND BSD-3-Clause"
git = [
    { path = "LICENSE-MIT", license = "MIT", checksum = "23f18e03dc49df91622fe2a76176497404e46ced8a715d9d2b67a7446571cca3" },
    { path = "AUTHORS", license = "MIT", checksum = "3bab8c36f6a85657504aaefb37c7ff34e29b8c917290f3d28a1f0920c992e502" },
    { path = "LICENSE.chromium", license = "BSD-3-Clause", checksum = "845022e0c1db1abb41a6ba4cd3c4b674ec290f3359d9d3c78ae558d4c0ed9308" },
]

