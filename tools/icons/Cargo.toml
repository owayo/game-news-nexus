[package]
name = "gnn-icons"
description = "アプリアイコンを SVG から書き出す (mise run icons)"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[features]
default = ["export"]
export = ["dep:anyhow", "dep:resvg", "dep:icns"]

[[bin]]
name = "gnn-icons"
required-features = ["export"]

[dependencies]
anyhow = { workspace = true, optional = true }
image.workspace = true
resvg = { workspace = true, features = ["raster-images"], optional = true }
icns = { workspace = true, optional = true }
