<svg xmlns="http://www.w3.org/2000/svg" viewBox="176 176 672 672" width="672" height="672">
  <!--
    macOS のメニューバーのアイコン (テンプレート画像) の元の絵。黒と透明だけで描き、色は macOS が付ける。
    アプリのアイコンと同じ記事のカードから、見出し・コントローラー・本文を抜く。書き出しは `mise run icons`。
  -->
  <defs>
